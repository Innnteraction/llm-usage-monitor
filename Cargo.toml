[package]
name = "llm-usage-monitor"
version = "0.12.0"
edition = "2021"
license = "MIT"
authors = ["Innnteraction"]
description = "Pure native LLM quota and token monitor"

[lib]
name = "llm_usage_monitor_core"
path = "src-native/lib.rs"

[[bin]]
name = "llm-usage-monitor"
path = "src-native/bin/main.rs"

[[bin]]
name = "test-collector"
path = "src-native/bin/test_collector.rs"

[[bin]]
name = "benchmark-native"
path = "src-native/bin/benchmark.rs"

[[bin]]
name = "cache-fixture"
path = "src-native/bin/cache_fixture.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
portable-pty = "0.8"
strip-ansi-escapes = "0.2"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
notify = "6.1"
# GPUI가 이미 사용하는 permissive dirs 버전으로 통일한다.
dirs = "4.0"
tempfile = "3.10"
anyhow = "1.0"
thiserror = "1.0"
gpui = "0.2"
tray-icon = "0.19"
muda = "0.15"
image = "0.25"
raw-window-handle = "0.6"


[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSWindow"] }
