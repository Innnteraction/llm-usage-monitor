name: Source installer validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/install*'
      - 'scripts/startup*'
      - 'scripts/migrate-login-items.applescript'
      - 'scripts/tests/test-install*.ps1'
      - 'apps/node/package.json'
      - 'apps/node/scripts/package-install.mjs'
      - 'apps/node/forge.config.ts'
      - 'apps/rust/Cargo.toml'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/install.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Isolated installer scenarios (PowerShell 7)
        shell: pwsh
        run: |
          ./scripts/tests/test-install.ps1
          ./scripts/tests/test-install-entry.ps1
      - name: Read-only environment check
        shell: pwsh
        run: ./scripts/install.ps1 -Check
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax and read-only checks
        run: |
          bash -n scripts/install.sh
          bash -n scripts/install-common.sh
          bash -n scripts/startup.sh
          osacompile -o "$RUNNER_TEMP/migrate-login-items.scpt" scripts/migrate-login-items.applescript
          bash scripts/install.sh --check
