name: Native Rust validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-native/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/native.yml'
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Rust toolchain
        run: rustup default stable
      - name: Test synthetic cases
        run: cargo test --locked --all-targets
      - name: Build release
        run: cargo build --locked --release --bins
      - name: Benchmark synthetic sessions
        run: cargo run --locked --release --bin benchmark-native
